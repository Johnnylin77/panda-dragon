<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<meta name="description" content="給小查理 — 大貓熊與小小龍，那段一起走過的路">
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>給小查理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=Long+Cang&display=swap">
<style>
  :root{
    --ground:#f4f0e7;
    --paper-2:#efe9db;
    --paper-edge:#e7dfcd;
    --ink:#3c3a33;
    --ink-soft:#726c5d;
    --ink-faint:#9a9585;
    --line:#ddd5c3;
    --accent:#56766a;

    --panda:#fbf8f1; --panda-line:#e5ddca; --panda-ink:#33302a;
    --dragon:#8fae9f; --dragon-2:#c1d2c6; --dragon-ink:#3d5a4d;

    --hill-1:#e0e0cd; --hill-2:#e8e6d6; --path:#e0d6bf;
    --sun:#ecc887; --moon:#f3ece0; --star:#b3b48c; --snow:#ffffff;
    --petal:#e6b7bd; --rain:#9fb2bd;
    --leaf-a:#cf9b57; --leaf-b:#c07548; --leaf-c:#b8944e;
    --flower:#e6b7bd; --flower2:#e9c887;
    --steam:#c9c3b3;

    --sky-dawn-top:#f0e7dc; --sky-dawn-bot:#eef0e9;
    --sky-dusk-top:#ecd9c9; --sky-dusk-bot:#eae5d8;
    --sky-night-top:#b6c3d0; --sky-night-bot:#dfe0d8;
    --sky-winter-top:#d7e0e6; --sky-winter-bot:#eef1ec;
    --sky-spring-top:#f3e5ea; --sky-spring-bot:#eef2e6;
    --sky-summer-top:#e7eede; --sky-summer-bot:#f5f2e5;
    --sky-autumn-top:#f2e3cd; --sky-autumn-bot:#f4eddc;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ground:#1c2026; --paper-2:#232830; --paper-edge:#2c323b;
      --ink:#e9e3d5; --ink-soft:#a7a08f; --ink-faint:#6f6a5c;
      --line:#333a44; --accent:#94b4a3;
      --panda:#ece7db; --panda-line:#cfc8b6; --panda-ink:#2b2925;
      --dragon:#7ca08f; --dragon-2:#9db8ab; --dragon-ink:#2c463b;
      --hill-1:#2a3037; --hill-2:#242a31; --path:#333a33;
      --sun:#caa25e; --moon:#d9d3c4; --star:#c7d0da; --snow:#e9edf1;
      --petal:#c98e97; --rain:#5f6f79;
      --leaf-a:#b6864a; --leaf-b:#a5613c; --leaf-c:#9d7c42;
      --flower:#c98e97; --flower2:#c9a45e; --steam:#5a5f68;
      --sky-dawn-top:#282b31; --sky-dawn-bot:#1e232a;
      --sky-dusk-top:#2a2129; --sky-dusk-bot:#1e232a;
      --sky-night-top:#1a2735; --sky-night-bot:#141a21;
      --sky-winter-top:#232b33; --sky-winter-bot:#1c2128;
      --sky-spring-top:#2b2731; --sky-spring-bot:#1e232a;
      --sky-summer-top:#232a26; --sky-summer-bot:#1d222a;
      --sky-autumn-top:#2d2820; --sky-autumn-bot:#20242a;
    }
  }
  :root[data-theme="dark"]{
    --ground:#1c2026; --paper-2:#232830; --paper-edge:#2c323b;
    --ink:#e9e3d5; --ink-soft:#a7a08f; --ink-faint:#6f6a5c;
    --line:#333a44; --accent:#94b4a3;
    --panda:#ece7db; --panda-line:#cfc8b6; --panda-ink:#2b2925;
    --dragon:#7ca08f; --dragon-2:#9db8ab; --dragon-ink:#2c463b;
    --hill-1:#2a3037; --hill-2:#242a31; --path:#333a33;
    --sun:#caa25e; --moon:#d9d3c4; --star:#c7d0da; --snow:#e9edf1;
    --petal:#c98e97; --rain:#5f6f79;
    --leaf-a:#b6864a; --leaf-b:#a5613c; --leaf-c:#9d7c42;
    --flower:#c98e97; --flower2:#c9a45e; --steam:#5a5f68;
    --sky-dawn-top:#282b31; --sky-dawn-bot:#1e232a;
    --sky-dusk-top:#2a2129; --sky-dusk-bot:#1e232a;
    --sky-night-top:#1a2735; --sky-night-bot:#141a21;
    --sky-winter-top:#232b33; --sky-winter-bot:#1c2128;
    --sky-spring-top:#2b2731; --sky-spring-bot:#1e232a;
    --sky-summer-top:#232a26; --sky-summer-bot:#1d222a;
    --sky-autumn-top:#2d2820; --sky-autumn-bot:#20242a;
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Noto Serif TC",Georgia,"Songti TC",serif;
    min-height:100vh;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .book{width:100%;max-width:700px;margin:0 auto}

  .topbar{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;padding:0 4px 12px;
  }
  .topbar .mark{
    font-family:"Long Cang",cursive;
    font-size:22px;color:var(--ink-soft);letter-spacing:.02em;
  }
  .topbar button{
    font-family:inherit;font-size:12px;letter-spacing:.14em;
    color:var(--ink-soft);background:none;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;cursor:pointer;transition:.2s;
  }
  .topbar button:hover{color:var(--ink);border-color:var(--ink-faint)}

  .spread{
    position:relative;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 1px 0 var(--paper-edge),0 18px 40px -28px rgba(40,36,28,.5);
    overflow:hidden;
  }

  .page{display:none;flex-direction:column}
  .page.is-current{display:flex}
  @media (prefers-reduced-motion: no-preference){
    .page.is-current{animation:fade .6s ease both}
  }
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .page-art{position:relative;width:100%}
  .page-art svg{display:block;width:100%;height:auto}

  .tapzone{
    position:absolute;top:0;bottom:0;width:42%;border:0;background:transparent;
    cursor:pointer;padding:0;z-index:3;
  }
  .tapzone.prev{left:0} .tapzone.next{right:0}
  .tapzone:focus-visible{outline:2px solid var(--accent);outline-offset:-6px;border-radius:12px}

  .page-copy{
    padding:22px clamp(20px,6vw,54px) 40px;
    text-align:center;
    display:flex;flex-direction:column;gap:.55em;
  }
  .page-copy .line{
    margin:0;
    font-size:clamp(16px,2.5vw,19px);
    font-weight:300;
    line-height:2.05;
    letter-spacing:.03em;
    color:var(--ink);
    text-wrap:balance;
  }
  .page-copy .note{
    font-family:"Long Cang",cursive;
    font-size:clamp(20px,3.4vw,25px);
    line-height:1.5;
    color:var(--ink-soft);
    margin-top:.2em;
  }
  .page-copy .sign{
    margin-top:1.4em;
    align-self:flex-end;
    font-family:"Long Cang",cursive;
    font-size:clamp(19px,3vw,23px);
    color:var(--ink-soft);
    text-align:right;
    line-height:1.7;
  }

  /* cover */
  .page.cover .page-copy{padding-top:30px;padding-bottom:46px;gap:.35em}
  .cover .kicker{
    font-size:12px;letter-spacing:.42em;color:var(--accent);
    text-transform:uppercase;margin-bottom:.4em;
  }
  .cover h1{
    font-weight:500;font-size:clamp(38px,10vw,58px);
    margin:0;letter-spacing:.08em;color:var(--ink);
  }
  .cover .sub{
    font-family:"Long Cang",cursive;
    font-size:clamp(21px,4vw,28px);
    color:var(--ink-soft);margin-top:.5em;letter-spacing:.03em;
  }
  .cover .hint{
    margin-top:1.9em;font-size:12.5px;letter-spacing:.2em;color:var(--ink-faint);
  }

  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 6px 0;
  }
  .nav button{
    font-family:inherit;font-size:14px;
    color:var(--ink-soft);background:none;border:1px solid var(--line);
    width:44px;height:44px;border-radius:999px;cursor:pointer;transition:.2s;
    display:grid;place-items:center;
  }
  .nav button:hover:not(:disabled){color:var(--ink);border-color:var(--ink-faint)}
  .nav button:disabled{opacity:.32;cursor:default}
  .counter{
    font-size:12px;letter-spacing:.3em;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }

  @media print{
    body{padding:0;background:#fff;display:block}
    .topbar,.nav,.tapzone{display:none}
    .book{max-width:none}
    .spread{box-shadow:none;border:none;border-radius:0;overflow:visible;background:transparent}
    .page{display:flex !important;opacity:1!important;transform:none!important;
      page-break-after:always;break-after:page;padding:16px 0}
    .page:last-child{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>
<div class="book">
  <div class="topbar">
    <span class="mark">給小查理</span>
    <button id="printBtn" type="button">列印／存成 PDF</button>
  </div>
  <div class="spread">
    <div id="stage"></div>
  </div>
  <div class="nav">
    <button id="prev" type="button" aria-label="上一頁">‹</button>
    <span class="counter" id="counter"></span>
    <button id="next" type="button" aria-label="下一頁">›</button>
  </div>
</div>

<script>
/* ---------- little drawings (original, generic panda + dragon) ---------- */
function panda(x,y,s){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <ellipse cx="0" cy="5" rx="46" ry="10" fill="rgba(40,36,28,.10)"/>
    <ellipse cx="0" cy="-42" rx="42" ry="47" fill="var(--panda)" stroke="var(--panda-line)" stroke-width="2"/>
    <ellipse cx="-19" cy="-8" rx="14" ry="12" fill="var(--panda-ink)"/>
    <ellipse cx="19" cy="-8" rx="14" ry="12" fill="var(--panda-ink)"/>
    <ellipse cx="-39" cy="-42" rx="12" ry="21" fill="var(--panda-ink)" transform="rotate(20 -39 -42)"/>
    <ellipse cx="39" cy="-42" rx="12" ry="21" fill="var(--panda-ink)" transform="rotate(-20 39 -42)"/>
    <circle cx="0" cy="-93" r="38" fill="var(--panda)" stroke="var(--panda-line)" stroke-width="2"/>
    <circle cx="-27" cy="-119" r="13" fill="var(--panda-ink)"/>
    <circle cx="27" cy="-119" r="13" fill="var(--panda-ink)"/>
    <ellipse cx="-14" cy="-97" rx="9" ry="12.5" fill="var(--panda-ink)" transform="rotate(-18 -14 -97)"/>
    <ellipse cx="14" cy="-97" rx="9" ry="12.5" fill="var(--panda-ink)" transform="rotate(18 14 -97)"/>
    <circle cx="-13" cy="-96" r="3" fill="var(--panda)"/>
    <circle cx="13" cy="-96" r="3" fill="var(--panda)"/>
    <ellipse cx="0" cy="-83" rx="4.6" ry="3" fill="var(--panda-ink)"/>
    <path d="M0 -80 q -6 8 -12 3 M0 -80 q 6 8 12 3" fill="none" stroke="var(--panda-ink)" stroke-width="1.6" stroke-linecap="round"/>
  </g>`;
}
function dragon(x,y,s){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <ellipse cx="0" cy="4" rx="27" ry="7" fill="rgba(40,36,28,.10)"/>
    <path d="M19 -14 q 27 3 22 26 q -3 10 -11 7 q 8 -6 2 -17 q -6 -8 -19 -6 z" fill="var(--dragon)"/>
    <path d="M-25 -36 q -17 -6 -21 6 q 13 0 19 5 z" fill="var(--dragon)" opacity=".9"/>
    <ellipse cx="0" cy="-25" rx="28" ry="27" fill="var(--dragon)"/>
    <ellipse cx="0" cy="-19" rx="16" ry="18" fill="var(--dragon-2)"/>
    <ellipse cx="-12" cy="-3" rx="9" ry="7" fill="var(--dragon)"/>
    <ellipse cx="12" cy="-3" rx="9" ry="7" fill="var(--dragon)"/>
    <path d="M-7 -52 l7 -11 l7 11 z" fill="var(--dragon-ink)" opacity=".5"/>
    <circle cx="-9" cy="-31" r="4.6" fill="var(--dragon-ink)"/>
    <circle cx="9" cy="-31" r="4.6" fill="var(--dragon-ink)"/>
    <circle cx="-7.4" cy="-32.6" r="1.5" fill="#fff"/>
    <circle cx="10.6" cy="-32.6" r="1.5" fill="#fff"/>
    <circle cx="-16" cy="-24" r="3.6" fill="var(--petal)" opacity=".55"/>
    <circle cx="16" cy="-24" r="3.6" fill="var(--petal)" opacity=".55"/>
    <path d="M-5 -22 q5 5 10 0" fill="none" stroke="var(--dragon-ink)" stroke-width="1.6" stroke-linecap="round"/>
  </g>`;
}

/* ---------- scenery ---------- */
const STARS=[[120,70,1.6],[180,120,1.2],[248,60,1.8],[520,50,1.3],[560,112,1.6],[700,140,1.2],[92,152,1.3],[352,90,1.4],[624,64,1.2],[470,124,1.5],[300,150,1.2],[660,196,1.3]];
const SNOW=[[100,80,2.6],[160,160,2],[240,120,2.9],[322,60,2],[402,180,2.4],[482,100,3],[560,150,2],[640,90,2.7],[700,206,2.2],[140,240,2],[300,224,2.7],[520,244,2],[600,282,2.3],[220,300,2],[420,300,2.6],[684,304,2]];
const PETALS=[[122,90,18],[224,150,-24],[344,80,10],[472,140,-14],[592,100,28],[684,180,-8],[160,232,14],[300,262,-30],[520,224,20],[642,262,-12],[210,110,-18],[560,66,22]];
const LEAVES=[[130,110],[252,90],[382,150],[520,110],[642,90],[700,164],[182,224],[332,252],[560,232],[458,88]];
const FLOWERS=[[150,406],[210,414],[600,406],[662,412],[520,417],[96,410]];

function stars(){return STARS.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--star)" opacity=".8"/>`).join('');}
function sun(){return `<circle cx="636" cy="92" r="72" fill="var(--sun)" opacity=".14"/><circle cx="636" cy="92" r="42" fill="var(--sun)" opacity=".5"/>`;}
function moon(){return `<circle cx="648" cy="88" r="34" fill="var(--moon)" opacity=".92"/><circle cx="634" cy="82" r="30" fill="var(--s-top)" opacity=".85"/>`;}
function snow(){return SNOW.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--snow)" opacity=".85"/>`).join('');}
function petals(){return PETALS.map(([x,y,a])=>`<ellipse cx="${x}" cy="${y}" rx="5" ry="3" fill="var(--petal)" opacity=".8" transform="rotate(${a} ${x} ${y})"/>`).join('');}
function rain(){let s='';for(let i=0;i<16;i++){const x=60+i*46+(i%2?12:0),y=60+(i%3)*40;s+=`<line x1="${x}" y1="${y}" x2="${x-10}" y2="${y+26}" stroke="var(--rain)" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>`;}return s;}
function leaves(){const c=['var(--leaf-a)','var(--leaf-b)','var(--leaf-c)'];return LEAVES.map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="6" ry="3.4" fill="${c[i%3]}" opacity=".85" transform="rotate(${(i*47)%360} ${x} ${y})"/>`).join('');}
function flowers(){return FLOWERS.map(([x,y],i)=>{const c=i%2?'var(--flower2)':'var(--flower)';return `<g opacity=".85"><circle cx="${x}" cy="${y-6}" r="2.4" fill="${c}"/><circle cx="${x-3}" cy="${y-3}" r="2.4" fill="${c}"/><circle cx="${x+3}" cy="${y-3}" r="2.4" fill="${c}"/><circle cx="${x}" cy="${y}" r="1.6" fill="var(--sun)"/></g>`;}).join('');}
function tree(kind){
  let dots='';
  if(kind==='blossom'){const p=[[74,150],[58,168],[92,166],[70,188],[104,150],[50,144],[112,178]];dots=p.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="var(--petal)" opacity=".85"/>`).join('');}
  if(kind==='autumn'){const p=[[74,150],[58,168],[92,166],[104,150],[50,146],[112,180],[70,190]];const c=['var(--leaf-a)','var(--leaf-b)','var(--leaf-c)'];dots=p.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="${c[i%3]}" opacity=".85"/>`).join('');}
  return `<g>
    <path d="M80 300 L80 168" stroke="var(--dragon-ink)" stroke-width="7" stroke-linecap="round" opacity=".4"/>
    <path d="M80 210 q -22 -14 -34 -30 M80 196 q 22 -12 34 -30 M80 182 q -14 -12 -22 -26" stroke="var(--dragon-ink)" stroke-width="4.5" fill="none" stroke-linecap="round" opacity=".4"/>
    ${dots}
  </g>`;
}
function coffee(){
  const cup=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})">
    <path d="M-6 -18 q0 -8 3 -12 M2 -20 q0 -8 3 -12" stroke="var(--steam)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M-11 -6 h22 l-3 18 q-1 4 -5 4 h-6 q-4 0 -5 -4 z" fill="var(--panda)" stroke="var(--panda-line)" stroke-width="1.5"/>
    <path d="M11 -2 q7 0 6 8 q-1 6 -7 6" fill="none" stroke="var(--panda-line)" stroke-width="2"/>
    <path d="M-9 -6 h18 l-1 6 h-16 z" fill="var(--accent)" opacity=".7"/>
  </g>`;
  return cup(486,392,1.15)+cup(520,400,.95);
}
function card(){ // little glowing note near the dragon
  return `<g transform="translate(452,372) rotate(-8)">
    <circle cx="8" cy="8" r="40" fill="var(--sun)" opacity=".18"/>
    <rect x="-16" y="-12" width="48" height="36" rx="4" fill="var(--panda)" stroke="var(--panda-line)" stroke-width="1.5"/>
    <path d="M-16 -8 l24 16 l24 -16" fill="none" stroke="var(--panda-line)" stroke-width="1.5"/>
    <path d="M-4 30 l6 -8 l6 8" fill="var(--petal)"/>
  </g>`;
}

function buildScene(p){
  const sky=`--s-top:var(--sky-${p.season}-top);--s-bot:var(--sky-${p.season}-bot)`;
  const gid='g'+p.i;
  let m='';
  const has=n=>p.motifs&&p.motifs.includes(n);
  // behind hills
  if(has('sun')) m+=sun();
  if(has('moon')) m+=moon();
  if(has('stars')) m+=stars();
  m+=`<path d="M0 328 Q 200 300 400 322 T 800 320 L800 460 L0 460 Z" fill="var(--hill-2)"/>`;
  m+=`<path d="M0 380 Q 250 350 480 378 T 800 372 L800 460 L0 460 Z" fill="var(--hill-1)"/>`;
  if(p.path!==false) m+=`<path d="M334 460 L466 460 Q 450 384 430 342 Q 419 316 411 302 L 393 302 Q 381 330 368 360 Q 348 412 334 460 Z" fill="var(--path)" opacity=".72"/>`;
  if(has('tree-bare')) m+=tree('bare');
  if(has('tree-blossom')) m+=tree('blossom');
  if(has('tree-autumn')) m+=tree('autumn');
  if(has('flowers')) m+=flowers();
  if(has('coffee')) m+=coffee();
  if(has('card')) m+=card();
  // characters
  const px=p.panda?p.panda[0]:322, py=p.panda?p.panda[1]:402, ps=p.panda?p.panda[2]:1.12;
  const dx=p.dragon?p.dragon[0]:432, dy=p.dragon?p.dragon[1]:410, ds=p.dragon?p.dragon[2]:1.0;
  m+=panda(px,py,ps)+dragon(dx,dy,ds);
  // falling motifs in front
  if(has('snow')) m+=snow();
  if(has('petals')) m+=petals();
  if(has('rain')) m+=rain();
  if(has('leaves')) m+=leaves();
  return `<svg class="scene" viewBox="0 0 800 460" role="img" style="${sky}" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--s-top)"/><stop offset="1" stop-color="var(--s-bot)"/></linearGradient></defs>
    <rect width="800" height="460" fill="url(#${gid})"/>${m}</svg>`;
}

/* ---------- the story ---------- */
const PAGES=[
  {cover:true,season:'dawn',motifs:['sun'],panda:[338,406,1.06],dragon:[452,413,.92],
   kicker:'2022.09 — 2026.09',title:'給小查理',sub:'大貓熊與小小龍．那段一起走過的路',hint:'輕觸右側，翻開下一頁 ›'},

  {season:'dusk',motifs:[],lines:['當妳看到這封信時，','大貓熊已經放下了肩上，','那份勤業的重擔。']},

  {season:'night',motifs:['moon','stars','card'],lines:['收到妳那張小卡片的時候，','妳大概很難想像，牠有多麼感動。'],
   note:'（每個入睡前，牠都要偷偷讀上一遍）'},

  {season:'winter',motifs:['snow','tree-bare'],lines:['2022、2023，','是牠人生裡一段很冷的冬天。','工作走到了瓶頸，心裡也有一場離別，','大貓熊幾乎，就要停下腳步了。']},

  {season:'spring',motifs:['tree-blossom','petals'],panda:[300,404,1.1],dragon:[470,412,1.0],
   lines:['就在那個轉角，牠遇見了小小龍。','沒有想太多，只覺得——','這隻小龍好暖，也好漂亮。'],note:'（噓，不要暗爽）'},

  {season:'summer',motifs:['sun','flowers'],lines:['每當有急事、有臨時要跑的路，','大貓熊第一個想到的，都是小小龍。','因為牠知道，妳會說：「沒問題。」','說也奇怪——原來，是妳，給了牠面對的勇氣。']},

/* ---------- render ---------- */
const stage=document.getElementById('stage');
const total=PAGES.length;
stage.innerHTML=PAGES.map((p,i)=>{
  p.i=i;
  const art=`<div class="page-art">${buildScene(p)}
      <button class="tapzone prev" data-dir="-1" aria-label="上一頁"></button>
      <button class="tapzone next" data-dir="1" aria-label="下一頁"></button></div>`;
  let copy;
  if(p.cover){
    copy=`<div class="page-copy">
      <div class="kicker">${p.kicker}</div>
      <h1>${p.title}</h1>
      <div class="sub">${p.sub}</div>
      <div class="hint">${p.hint}</div></div>`;
  }else{
    const lines=p.lines.map(l=>`<p class="line">${l}</p>`).join('');
    const note=p.note?`<p class="note">${p.note}</p>`:'';
    const sign=p.sign?`<div class="sign">${p.sign.replace(/\n/g,'<br>')}</div>`:'';
    copy=`<div class="page-copy">${lines}${note}${sign}</div>`;
  }
  return `<section class="page${p.cover?' cover':''}" data-i="${i}">${art}${copy}</section>`;
}).join('');

let cur=0;
const pages=[...stage.querySelectorAll('.page')];
const counter=document.getElementById('counter');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const pad=n=>String(n).padStart(2,'0');

function show(n){
  cur=Math.max(0,Math.min(total-1,n));
  pages.forEach((el,i)=>el.classList.toggle('is-current',i===cur));
  counter.textContent=`${pad(cur+1)} — ${pad(total)}`;
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  try{document.querySelector('.spread').scrollIntoView({block:'nearest'});}catch(e){}
}
function go(d){show(cur+d);}

prevBtn.onclick=()=>go(-1);
nextBtn.onclick=()=>go(1);
stage.addEventListener('click',e=>{const t=e.target.closest('.tapzone');if(t)go(+t.dataset.dir);});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
});
let tx=0;
stage.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(dx<0?1:-1);},{passive:true});
document.getElementById('printBtn').onclick=()=>window.print();

show(0);
</script>
